[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stateguard-core"
version = "0.1.0"
description = "See exactly why your AI agent gave wrong output. Debug multi-agent workflows in seconds."
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "ai-agents", "debugging", "multi-agent", "langgraph", "crewai",
    "autogen", "state-management", "testing", "agent-debugging", "llm-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiosqlite>=0.20.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
stateguard = "stateguard.cli:cli"

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

